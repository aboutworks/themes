<div
  class="card card-hover group transition-all duration-200 rounded-lg overflow-hidden bg-white border-gray-200 dark:bg-gray-800 shadow-sm h-full flex flex-col border border-gray-100"
>
  <a class="block flex flex-col h-full" href="{{ .Permalink }}">
    <div
      class="relative aspect-[4/3] bg-gray-100 dark:bg-gray-700 rounded-t-lg overflow-hidden flex-shrink-0"
    >
      <img
        alt="{{ .Title }}"
        loading="lazy"
        class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
        src="{{ .Image }}"
        onerror="this.style.display = 'none'"
      />
      {{ if eq .Protect true }}
      <span
        class="absolute top-2 left-2 px-1 py-0 text-[10px] bg-yellow-200 dark:bg-gray-700/90 text-gray-700 dark:text-gray-300 rounded-full shadow-sm"
      >需授权
      </span>
      {{ end }}

      
      {{ index .Tags 0 }}
      </span>
      <span
        class="absolute bottom-2 left-2 px-2 py-0.5 text-[10px] font-medium bg-white/90 dark:bg-gray-700/90 text-gray-700 dark:text-gray-300 rounded-full shadow-sm"
      >
        {{ index .Tags 0 }}
      </span>
      <span
        class="absolute top-2 right-2 px-1 py-0 text-[10px] font-medium bg-gray-500 text-white rounded-full"
      >
        {{ .Uuid }}
      </span>
      <div
        class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"
      >
        <span class="text-white text-xs font-semibold tracking-wide uppercase"
          >{{ i18n "view_details" }}</span
        >
      </div>
    </div>

    <div class="p-3 flex-1 flex flex-col gap-1 overflow-hidden">
      <h3 class="text-sm font-semibold text-gray-900 dark:text-white truncate">
        {{ .Title }}
      </h3>
      <p class="text-xs text-gray-500 dark:text-gray-400">Jimmy Wong</p>

      <div
        class="flex items-center gap-1 flex-wrap flex-shrink-0 max-h-[20px] overflow-hidden"
      >
        {{ range .Tags }}
        <span
          class="px-1.5 py-0.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded text-[10px]"
        >
          {{ . }}
        </span>
        {{ end }}
      </div>

      <div class="text-[10px] text-gray-400 line-clamp-3">{{ .Desc }}</div>

      <div
        class="mt-auto flex items-center gap-3 font-mono text-[11px] text-gray-400 flex-shrink-0"
      >
        <span class="inline-flex items-center gap-1">
          <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
            <path
              d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"
            ></path>
          </svg>
          {{ .Weight }}
        </span>
        <span class="inline-flex items-center gap-1">
          <svg
            class="w-3 h-3"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
            ></path>
          </svg>
          <span id="eyescount_{{ .Uuid }}">-</span>
        </span>
        <span
          class="ml-auto px-1.5 py-0.5 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 rounded text-[10px]"
        >
          {{ .Date.Format "2006-01-02" }}
        </span>
      </div>
    </div>
  </a>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    this.loadCount();
    // this.initLocalStorageData();
    // this.getdata();
  });
  // 加载点击数
  function loadCount() {
    console.log("加载点击数");
    document.querySelectorAll("[id^='eyescount_']").forEach((span) => {
      const uuid = span.id.replace("eyescount_", "");
      fetch(`https://handle.lehuye.com/datas/getClickCount?uuid=${uuid}`, {
        method: "GET",
        headers: {
          "Content-Type": "application/json",
          authorization: "keebone",
        },
      })
        .then((res) => res.json())
        .then((data) => {
          span.innerText = data.count ?? 0;
        })
        .catch((err) => console.error("Error fetching click count:", err));
    });
  }

  // 增加点击数
  function clickaddcount(uuid) {
    console.log("增加点击数");
    fetch(`https://handle.lehuye.com/datas/incrementClickCount`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        authorization: "keebone",
      },
      body: JSON.stringify({ uuid }),
    })
      .then((res) => res.json())
      .then((data) => {
        console.log(data);
        const span = document.getElementById(`eyescount_${uuid}`);
        if (span) {
          span.innerText = data.count ?? 0;
        }
      })
      .catch((err) => console.error("Error updating click count:", err));
  }
</script>

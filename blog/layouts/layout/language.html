{{ if hugo.IsMultilingual }}
  <div id="lang-toggle" class="inline-flex items-center justify-center p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
    {{ range .AllTranslations }}
      <a href="{{ .RelPermalink }}" 
         title="{{ .Language.LanguageName }}"
         class="text-gray-700 dark:text-gray-300 font-medium text-sm no-underline">
        {{ if eq .Lang "zh" }}中{{ else }} / EN{{ end }}
      </a>
    {{ end }}
  </div>
{{ end }}

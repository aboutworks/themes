      <div class="flex flex-row gap-3 pl-6">
        {{ range .Site.Menus.main }}
        <a
          href="{{ .URL | relLangURL }}"
          class="flex items-center text-sm px-4 py-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 transition-all"

          {{ i18n .Identifier }}
        </a>
        {{ end }}

    <div class="flex items-center space-x-3">
      <!-- 搜索按钮 -->
      <button
        id="search-toggle"
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
      >
        <i class="fa fa-search text-gray-700 dark:text-gray-300"></i>
        <!-- 图标颜色：同上 -->
      </button>
      <!-- 中英文切换按钮（新增 ✅） -->
      {{ template "layout/language.html" . }}

      <!-- 右侧菜单按钮 -->
      <button
        id="menu-right-toggle"
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
      >
        <i class="fa fa-ellipsis-h text-gray-700 dark:text-gray-300"></i>
        <!-- 图标颜色：同上 -->
      </button>
    </div>
  </div>
</header>

<!-- 侧边栏  -->
{{ template "layout/aside.html" . }}

<!-- 搜索 -->
{{ partial "search.html" . }}

<!-- 设置-->
{{ partial "settings.html" . }}

<script>
  // 语言切换（跳转对应语言页面，风格与你现有JS完全一致）
  const langToggle = document.getElementById("lang-toggle");
  if (langToggle) {
    langToggle.addEventListener("click", () => {
      console.log("当前路径:", window.location.pathname);
      const currentLang = window.location.pathname.startsWith("/en/")
        ? "en"
        : "zh";
      let targetUrl;

      if (currentLang === "zh") {
        // 中文 → 英文
        targetUrl = window.location.pathname.replace("/zh/", "/en/") || "/en/";
      } else {
        // 英文 → 中文
        targetUrl = window.location.pathname.replace("/en/", "/zh/") || "/zh/";
      }

      window.location.href = targetUrl;
    });
  }
</script>

{{ define "main" }}
  <!-- 左侧表单主区域 -->
  <section
class="w-full flex-1 dark:bg-gray-800 p-6 pt-24 md:p-12 md:pr-[330px] pt-24 relative overflow-hidden min-h-screen flex items-start justify-end"
  >
    <!-- 语言切换组件 -->
    {{ template "layout/changelanuge.html" .}}

    <div class="w-full max-w-md">
      <!-- 页面标题 -->
      <div class="text-center mb-8">
        <h2 class="text-[24px] font-bold text-gray-800 dark:text-white">{{ i18n "contact.title" }}</h2>
        <p class="text-sm text-gray-500 dark:text-gray-400 mt-2">{{ i18n "contact.desc" }}</p>
      </div>

      <!-- 联系表单 -->
      <form id="contactForm" class="space-y-5">
        <!-- 1. 联系人姓名 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">
            {{ i18n "contact.name" }}
          </label>
          <input
            type="text"
            name="username"
            required
            class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-black-500 dark:focus:ring-white/60 focus:border-transparent bg-white dark:bg-gray-700 dark:text-white"
            placeholder="{{ i18n "contact.placeholder_name" }}"
          />
        </div>

        <!-- 2. 联系手机号 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">
            {{ i18n "contact.phone" }}
          </label>
          <input
            type="tel"
            name="phone"
            required
            class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-black-500 dark:focus:ring-white/60 focus:border-transparent bg-white dark:bg-gray-700 dark:text-white"
            placeholder="{{ i18n "contact.placeholder_phone" }}"
          />
        </div>

        <!-- 3. 详细地址 -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">
            {{ i18n "contact.address" }}
          </label>
          <input
            type="text"
            name="address"
            required
            class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-black-500 dark:focus:ring-white/60 focus:border-transparent bg-white dark:bg-gray-700 dark:text-white"
            placeholder="{{ i18n "contact.placeholder_address" }}"
          />
        </div>

        <!-- 4. 备注留言（多行文本框） -->
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">
            {{ i18n "contact.remark" }}
          </label>
          <textarea
            name="remark"
            rows="4"
            class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-black-500 dark:focus:ring-white/60 focus:border-transparent resize-none bg-white dark:bg-gray-700 dark:text-white"
            placeholder="{{ i18n "contact.placeholder_remark" }}"
          ></textarea>
        </div>

        <!-- 👇 验证码模块 -->
        <div class="space-y-2">
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-200">验证码</label>
          <div class="flex gap-3">
            <input
              type="text"
              id="codeInput"
              placeholder="请输入验证码"
              class="flex-1 px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-black-500 dark:focus:ring-white/60 focus:border-transparent bg-white dark:bg-gray-700 dark:text-white"
            />
            <canvas id="captchaCanvas" class="w-[120px] h-[50px] rounded-lg border border-gray-300 dark:border-gray-600 cursor-pointer"></canvas>
          </div>
        </div>

        <!-- 提交按钮 -->
        <button
          type="submit"
          class="w-full bg-black hover:bg-gray-800 dark:bg-white dark:hover:bg-gray-100 dark:text-black text-white py-3 rounded-xl transition font-medium text-base"
        >
          {{ i18n "contact.submit" }}
        </button>
      </form>
    </div>

  {{ template "layout/menu.html" .}}
  </section>

<script>
// ========== 纯前端 Canvas 验证码 ==========
const canvas = document.getElementById('captchaCanvas');
const ctx = canvas.getContext('2d');
const form = document.getElementById('contactForm');
const codeInput = document.getElementById('codeInput');

let currentCode = '';

// 生成随机验证码
function generateCode() {
  const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let code = '';
  for (let i = 0; i < 4; i++) {
    code += chars[Math.floor(Math.random() * chars.length)];
  }
  currentCode = code;
  drawCode(code);
}

// 绘制到画布
function drawCode(code) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = 'bold 26px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  // 干扰线
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = randomColor();
    ctx.beginPath();
    ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
    ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
    ctx.stroke();
  }

  // 文字
  for (let i = 0; i < code.length; i++) {
    ctx.fillStyle = randomColor();
    ctx.fillText(code[i], 25 + i * 25, canvas.height / 2);
  }
}

function randomColor() {
  const r = Math.floor(Math.random() * 100);
  const g = Math.floor(Math.random() * 100);
  const b = Math.floor(Math.random() * 100);
  return `rgb(${r},${g},${b})`;
}

// 点击刷新
canvas.addEventListener('click', generateCode);

// 表单提交校验
form.addEventListener('submit', function (e) {
  const val = codeInput.value.trim().toUpperCase();
  if (val !== currentCode) {
    e.preventDefault();
    alert('验证码不正确');
    generateCode();
    codeInput.value = '';
    codeInput.focus();
  }
});

// 初始化
generateCode();
</script>
{{ end }}

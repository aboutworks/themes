{{ define "main" }}
<section class="w-full h-screen bg-white overflow-hidden relative flex justify-end">

  <!-- 左侧：全屏藏品滚动区域 -->
  <div class="flex-1 h-screen overflow-y-auto snap-y snap-mandatory">

    {{ range .Params.collection_items }}
    <!-- 单个藏品 = 一整屏 -->
    <div class="relative w-full h-screen snap-start flex items-center justify-center overflow-hidden">

      <!-- 背景大图（底图式陈列） -->
      <div class="absolute inset-0 z-0">
        <img
          src="{{ .image }}"
          alt="{{ .title }}"
          class="w-full h-full object-cover object-center scale-105"
        />
        <!-- 简奢渐变压暗，突出文字 -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-black/5 to-black/40"></div>
      </div>

      <!-- 中央奢华文案 -->
      <div class="relative z-10 text-center px-8">
        <p class="text-[10px] uppercase tracking-[0.5em] text-white/80 mb-4">
          {{ .material }}
        </p>
        <h2 class="text-4xl md:text-5xl font-light text-white leading-tight mb-6">
          {{ .title }}
        </h2>
        <p class="text-sm text-white/70 max-w-xs mx-auto leading-loose tracking-wide">
          {{ .desc }}
        </p>
      </div>

    </div>
    {{ end }}

  </div>

  <!-- 右侧菜单（保留不变） -->
  {{ template "layout/menu.html" . }}

</section>

<style>
  /* 平滑滚动 + 隐藏滚动条更高级 */
  .snap-y {
    scroll-snap-type: y mandatory;
  }
  .snap-start {
    scroll-snap-align: start;
  }
  /* 隐藏滚动条保持奢华极简 */
  .flex-1::-webkit-scrollbar {
    display: none;
  }
  .flex-1 {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
</style>
{{ end }}

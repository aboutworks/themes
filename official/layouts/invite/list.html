{{ define "main" }}
<section class="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-zinc-50 to-zinc-100">
  <div class="w-full max-w-md mx-auto flex flex-col items-center gap-6">
    
    <!-- Logo 居中 -->
    {{ template "icon/logo.html" . }}
    
    <!-- 邀请码卡片 -->
    <div class="w-full bg-white rounded-3xl shadow-sm p-8 md:p-10">
      <div class="text-center mb-8">
        <h1 class="text-xl font-semibold text-zinc-900">{{ i18n "invite.title" }}</h1>
        <p class="text-sm text-zinc-500 mt-2">{{ i18n "invite.subtitle" }}</p>
      </div>

      <form id="inviteForm" class="space-y-5">
        <!-- 邀请码输入 -->
        <div>
          <label class="block text-sm font-medium text-zinc-700 mb-1">
            {{ i18n "invite.invite_code" }}
          </label>
          <input
            type="text"
            id="inviteCode"
            class="w-full px-4 py-3 border border-zinc-300 rounded-xl focus:ring-2 focus:ring-black focus:border-transparent outline-none font-mono tracking-wide"
            placeholder="{{ i18n "invite.placeholder" }}"
            autocomplete="off"
            required
          />
          <p id="errorTip" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>

        <!-- 验证按钮 -->
        <button
          type="submit"
          class="w-full bg-black hover:bg-zinc-800 text-white py-3 rounded-xl transition font-medium"
        >
          {{ i18n "invite.verify" }}
        </button>
      </form>
    </div>
  </div>
</section>


<script>
  const form = document.getElementById('inviteForm');
  const errorTip = document.getElementById('errorTip');
  const inviteInput = document.getElementById('inviteCode');

  // 邀请码格式校验（6-16位字母数字）
  function isValidCode(code) {
    return /^[A-Za-z0-9]{6,16}$/.test(code.trim());
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = inviteCode.value.trim();

    // 前端格式校验
    if (!isValidCode(code)) {
      errorTip.textContent = '{{ i18n "invite.error_format" }}';
      errorTip.classList.remove('hidden');
      return;
    }
    errorTip.classList.add('hidden');

    // 后端校验接口（你自己替换真实地址）
    const apiUrl = `/api/verify-invite?code=${encodeURIComponent(code)}`;

    try {
      const res = await fetch(apiUrl, { method: 'GET' });
      const data = await res.json();

      if (res.ok && data.valid === true) {
        // 校验通过，跳转到注册页，并把邀请码带过去
        location.href = `/signup?invite=${encodeURIComponent(code)}`;
      } else {
        errorTip.textContent = data.msg || '{{ i18n "invite.error_invalid" }}';
        errorTip.classList.remove('hidden');
      }
    } catch (err) {
      errorTip.textContent = '{{ i18n "invite.error_network" }}';
      errorTip.classList.remove('hidden');
    }
  });
</script>
{{ end }}
